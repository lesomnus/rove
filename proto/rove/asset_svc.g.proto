option go_package = "github.com/lesomnus/rove";

service AssetService {
  // Add creates a new Asset
  rpc Add(AssetAddRequest) returns (Asset);
  // Get retrieves a Asset
  rpc Get(AssetGetRequest) returns (Asset);
  // Patch updates an existing Asset
  rpc Patch(AssetPatchRequest) returns (Asset);
  // Apply applies a patch document to an existing Asset
  rpc Apply(AssetApplyRequest) returns (Asset);
  // Erase deletes a Asset
  rpc Erase(AssetRef) returns (AssetEraseResponse);
  // List reads Assets a page at a time.
  rpc List(AssetListRequest) returns (AssetListResponse);
  // Watch the Assets this caller may see, as they are now and as they change.
  //
  // What arrives is **state and never a delta**, so a client converges rather
  // than replays: it keeps what it was last told about a row and replaces it.
  // An event it did not receive is one it does not need, since the next one
  // about that row carries the whole of it.
  //
  // The first message is everything that matches right now, so a client does
  // not have to List first and race the subscription. A row may arrive twice --
  // once in that first message and once as a change that happened while it was
  // being read -- and that is harmless for the same reason.
  rpc Watch(AssetWatchRequest) returns (stream AssetWatchResponse);
}

service TreeLockService {
  // Add creates a new TreeLock
  rpc Add(TreeLockAddRequest) returns (TreeLock);
  // Get retrieves a TreeLock
  rpc Get(TreeLockGetRequest) returns (TreeLock);
  // Patch updates an existing TreeLock
  rpc Patch(TreeLockPatchRequest) returns (TreeLock);
  // Apply applies a patch document to an existing TreeLock
  rpc Apply(TreeLockApplyRequest) returns (TreeLock);
  // Erase deletes a TreeLock
  rpc Erase(TreeLockRef) returns (TreeLockEraseResponse);
}

